name: Daily Review Poster

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST everyday
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Generate Random Review Entry
        run: python generate_review.py

      - name: Post Review
        run: python submit_review.py

      - name: Commit and push updated reviews.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate and post daily review [skip ci]"
            git push
          fi