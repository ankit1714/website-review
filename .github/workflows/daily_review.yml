name: Daily Review Poster

on:
  schedule:
    # Runs everyday at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  # Allows triggering the workflow manually via GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Review Automation Script
        run: python submit_review.py

      - name: Commit and push updated reviews.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.csv
          if git diff --staged --quiet; then
            echo "No changes in CSV (no pending reviews or nothing updated)."
          else
            git commit -m "Auto-update reviews.csv [skip ci]"
            git push
          fi
